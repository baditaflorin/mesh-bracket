when:
  event:
    - push
    - pull_request

steps:
  verify:
    image: node:22
    commands:
      - git clone --depth 1 --filter=blob:none --sparse https://github.com/baditaflorin/mesh-common.git ../mesh-common
      - git -C ../mesh-common sparse-checkout set --cone src testing scaffold scripts presets
      - test "$(git -C ../mesh-common rev-parse HEAD)" = "7fda31aa82603cb63414932b565173db281728aa"
      - npm ci --prefix ../mesh-common
      - npm ci
      - npm run fmt:check
      - npm run typecheck
      - npm run test:unit
      - npm run smoke
